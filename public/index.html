<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CF AI Assignment Chat</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        font-family: Inter, system-ui, sans-serif;
        max-width: 780px;
        margin: 2rem auto;
        padding: 0 1rem;
      }
      #chat {
        border: 1px solid #7774;
        border-radius: 10px;
        min-height: 320px;
        padding: 12px;
        margin-bottom: 12px;
        overflow: auto;
      }
      .msg {
        margin: 0.5rem 0;
      }
      .role {
        font-weight: 700;
      }
      form {
        display: flex;
        gap: 8px;
      }
      input,
      button {
        padding: 10px;
        font-size: 14px;
      }
      #message {
        flex: 1;
      }
    </style>
  </head>
  <body>
    <h1>Cloudflare AI Assignment Chat</h1>
    <p>Session memory is stored per browser in Durable Objects.</p>
    <div id="chat"></div>

    <form id="chatForm">
      <input id="message" placeholder="Ask anything..." required />
      <button type="submit">Send</button>
    </form>

    <script>
      const chat = document.getElementById("chat");
      const form = document.getElementById("chatForm");
      const messageInput = document.getElementById("message");
      const sessionId =
        localStorage.getItem("session_id") ||
        "session-" + Math.random().toString(36).slice(2);
      localStorage.setItem("session_id", sessionId);

      function append(role, content) {
        const div = document.createElement("div");
        div.className = "msg";
        div.innerHTML = `<span class="role">${role}:</span> ${content}`;
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const message = messageInput.value.trim();
        if (!message) return;

        append("You", message);
        messageInput.value = "";

        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ sessionId, message }),
        });

        if (!res.ok) {
          append("System", "Request failed.");
          return;
        }

        const data = await res.json();
        append("Assistant", data.reply || "No response");
      });
    </script>
  </body>
</html>
